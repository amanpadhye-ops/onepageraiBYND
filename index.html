<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OnePager AI — by Bynd</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F5F6FA;color:#1a1a2e;min-height:100vh}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.fade-up{animation:fadeUp .4s ease both}

/* SEARCH VIEW */
#search-view{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.logo{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:48px;letter-spacing:-.5px}
.logo span{color:#2563EB}
.search-card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);padding:32px;width:100%;max-width:560px}
.search-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.search-input{width:100%;padding:11px 14px;font-size:15px;border:1.5px solid #E5E7EB;border-radius:10px;outline:none;font-family:inherit;color:#111;background:#fff;transition:border-color .15s}
.search-input:focus{border-color:#2563EB}
.hint-input{width:100%;padding:9px 14px;font-size:13px;border:1.5px solid #E5E7EB;border-radius:10px;outline:none;font-family:inherit;color:#6B7280;background:#FAFAFA;margin-top:8px}
.search-btn{width:100%;margin-top:16px;padding:12px;background:#2563EB;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.search-btn:disabled{background:#93C5FD;cursor:not-allowed}
.examples{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:5px 12px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:100px;font-size:12px;color:#1D4ED8;cursor:pointer;font-family:inherit}
.features{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:560px;width:100%}
.feat{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px;text-align:center}
.feat-icon{font-size:20px;margin-bottom:6px}
.feat-title{font-size:13px;font-weight:600;color:#111;margin-bottom:4px}
.feat-desc{font-size:12px;color:#6B7280;line-height:1.5}

/* RESULT VIEW */
#result-view{display:none;min-height:100vh;background:#F5F6FA;padding-bottom:60px}
.topbar{background:#fff;border-bottom:1px solid #E5E7EB;padding:12px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.back-btn{background:none;border:none;cursor:pointer;font-size:18px;color:#6B7280;padding:0 4px}
.company-name{font-weight:700;font-size:16px}
.company-sub{font-size:12px;color:#9CA3AF}
.quality-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px}
.quality-RICH{color:#065F46;background:#D1FAE5}
.quality-MODERATE{color:#92400E;background:#FEF3C7}
.quality-SPARSE{color:#991B1B;background:#FEE2E2}
.section-title{padding:28px 32px 0;font-size:26px;font-weight:800;letter-spacing:-.5px}
.grid-2{display:grid;grid-template-columns:1fr 420px;gap:20px;padding:20px 32px 0;align-items:start}
.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 32px 0}
.panel{border:1px solid #D1D5DB;border-radius:8px;overflow:hidden;background:#fff}
.panel-header{background:#1E3A5F;color:#fff;font-weight:700;font-size:13px;padding:8px 14px;text-transform:uppercase;letter-spacing:.02em}
.panel-body{padding:16px}
.desc{font-size:13px;color:#374151;line-height:1.7;margin-bottom:14px;border-left:3px solid #2563EB;padding-left:10px;font-style:italic}
.bullet{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px}
.bullet-dot{color:#2563EB;margin-top:4px;flex-shrink:0}
.bullet-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
.badge-HIGH{color:#065F46;background:#D1FAE5}
.badge-MEDIUM{color:#92400E;background:#FEF3C7}
.badge-LOW{color:#991B1B;background:#FEE2E2}
.src-link{font-size:11px;color:#2563EB;text-decoration:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.fin-note{padding:8px 12px;background:#FFFBEB;border-bottom:1px solid #FDE68A;font-size:11px;color:#92400E}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1px solid #E5E7EB;background:#F9FAFB}
th.left{text-align:left}th.right{text-align:right}th.center{text-align:center}
td{padding:9px 12px;border-top:1px solid #F3F4F6}
.row-key{font-weight:700;background:#F0F7FF}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pct{text-align:right;color:#2563EB;font-variant-numeric:tabular-nums}
td.null{text-align:right;color:#D1D5DB}
td.center{text-align:center}
.product-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F3F4F6}
.product-icon{width:36px;height:36px;border-radius:6px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.product-name{font-weight:600;font-size:13px;margin-bottom:2px}
.product-desc{font-size:12px;color:#6B7280;line-height:1.5;margin-bottom:4px}
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.client-card{border:1px solid #E5E7EB;border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.client-icon{width:40px;height:40px;border-radius:8px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:18px}
.client-name{font-size:12px;font-weight:600;text-align:center}
.sparse-warn{margin:16px 32px 0;background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:10px 16px;font-size:13px;color:#92400E}
.sources-bar{margin:20px 32px 0;padding:16px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px}
.sources-label{font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.sources-list{display:flex;flex-wrap:wrap;gap:8px}
.source-tag{font-size:11px;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;padding:3px 8px;text-decoration:none}
.not-found{padding:20px;text-align:center;font-size:13px;color:#9CA3AF;font-style:italic;border:1px dashed #E5E7EB;border-radius:8px;margin:8px}
.example-outputs{margin-top:32px;display:flex;gap:12px;justify-content:center}
.ex-btn{padding:8px 18px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;font-size:13px;color:#1D4ED8;cursor:pointer;font-family:inherit;font-weight:500}
</style>
</head>
<body>

<!-- SEARCH VIEW -->
<div id="search-view">
  <div class="logo fade-up">OnePager<span>AI</span></div>
  <div class="search-card fade-up">
    <label class="search-label">Company name</label>
    <input id="company-input" class="search-input" placeholder="e.g. Bharat Forge Limited" oninput="updateBtn()"/>
    <input id="hint-input" class="hint-input" placeholder="Optional: ticker, website, or sector hint"/>
    <button id="gen-btn" class="search-btn" onclick="generate()" disabled>Generate one-pager →</button>
  </div>
  <div class="examples fade-up" style="margin-top:16px">
    <span style="font-size:12px;color:#9CA3AF;align-self:center">Try pre-loaded:</span>
    <button class="chip" onclick="loadExample('bharat')">Bharat Forge Limited</button>
    <button class="chip" onclick="loadExample('brakes')">Brakes India Private Limited</button>
  </div>
  <div class="features fade-up">
    <div class="feat"><div class="feat-icon">🔍</div><div class="feat-title">Deep research</div><div class="feat-desc">8–12 live web searches per company</div></div>
    <div class="feat"><div class="feat-icon">📎</div><div class="feat-title">Every claim cited</div><div class="feat-desc">Source URL on every bullet and figure</div></div>
    <div class="feat"><div class="feat-icon">🛡️</div><div class="feat-title">Honest gaps</div><div class="feat-desc">Gaps shown clearly — nothing invented</div></div>
  </div>
</div>

<!-- RESULT VIEW -->
<div id="result-view"></div>

function updateBtn(){
  document.getElementById('gen-btn').disabled = !document.getElementById('company-input').value.trim();
}

function loadExample(key){
  document.getElementById('search-view').style.display='none';
  renderResult(OUTPUTS[key]);
}

function generate(){
  const name = document.getElementById('company-input').value.trim().toLowerCase();
  if(name.includes('bharat forge')){loadExample('bharat');return;}
  if(name.includes('brakes india')){loadExample('brakes');return;}
  // Show note that live generation requires backend
  alert('Live generation requires the backend server with an Anthropic API key.\n\nTry the pre-loaded examples: Bharat Forge or Brakes India.');
}

function badge(level){
  if(!level) return '';
  const labels={HIGH:'● HIGH',MEDIUM:'◐ MED',LOW:'○ LOW'};
  return `<span class="badge badge-${level}">${labels[level]||level}</span>`;
}

function srcLink(src){
  if(!src||!src.url) return '';
  return `<a class="src-link" href="${src.url}" target="_blank" rel="noopener">↗ ${src.title||'Source'}</a>`;
}

function renderResult(data){
  const {company,overview,financials,products,clients,sources,dataQuality} = data;
  const r = document.getElementById('result-view');

  let html = `
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">←</button>
    <div style="flex:1">
      <div class="company-name">${company.name}</div>
      <div class="company-sub">${[company.ticker,company.exchange,company.headquarters].filter(Boolean).join(' · ')}</div>
    </div>
    <span class="quality-pill quality-${dataQuality?.overall||'MODERATE'}">Data: ${dataQuality?.overall||'?'}</span>
    <button onclick="window.print()" style="background:#2563EB;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Export PDF</button>
  </div>`;

  if(dataQuality?.overall==='SPARSE'){
    html+=`<div class="sparse-warn">⚠ <strong>Limited public data available.</strong> ${dataQuality.notes||''}</div>`;
  }

  html+=`<div class="section-title">${company.name} — Company Overview</div>`;

  // Overview + Financials
  html+=`<div class="grid-2">`;

  // Overview panel
  html+=`<div class="panel"><div class="panel-header">Company Overview</div><div class="panel-body">`;
  if(overview?.description) html+=`<p class="desc">${overview.description}</p>`;
  (overview?.bullets||[]).forEach(b=>{
    html+=`<div class="bullet"><span class="bullet-dot">▪</span><div><span>${b.text}</span><div class="bullet-meta">${badge(b.confidence)}${srcLink(b.source)}</div></div></div>`;
  });
  if(!overview?.bullets?.length) html+=`<div class="not-found">Not found in available public sources</div>`;
  html+=`</div></div>`;

  // Financials panel
  html+=`<div class="panel"><div class="panel-header">Financial Overview${financials?.currency?' ('+financials.currency+')':''}</div>`;
  if(financials?.note) html+=`<div class="fin-note">ℹ ${financials.note}</div>`;
  if(financials?.rows?.length){
    html+=`<table><thead><tr><th class="left">Particulars</th>${(financials.years||[]).map(y=>`<th class="right">${y}</th>`).join('')}<th class="center">Conf.</th></tr></thead><tbody>`;
    financials.rows.forEach(row=>{
      const isKey=['Revenue','EBITDA','Net Debt'].some(k=>row.label?.includes(k));
      html+=`<tr class="${isKey?'row-key':''}"><td>${row.label}${row.source?`<br>${srcLink(row.source)}`:''}`;
      html+=`</td>`;
      (row.values||[]).forEach(v=>{
        const cls = v===null?'null':row.isPercentage?'pct':'num';
        html+=`<td class="${cls}">${v===null?'—':v}</td>`;
      });
      html+=`<td class="center">${badge(row.confidence)}</td></tr>`;
    });
    html+=`</tbody></table>`;
  } else {
    html+=`<div class="not-found">Financial data not found in available public sources</div>`;
  }
  html+=`</div>`;

  html+=`</div>`; // end grid-2

  // Products + Clients
  html+=`<div class="grid-half">`;

  // Products
  html+=`<div class="panel"><div class="panel-header">Select Products</div><div class="panel-body">`;
  (products||[]).forEach(p=>{
    html+=`<div class="product-item"><div class="product-icon">📦</div><div><div class="product-name">${p.name}</div><div class="product-desc">${p.description}</div><div class="bullet-meta">${badge(p.confidence)}${srcLink(p.source)}</div></div></div>`;
  });
  if(!products?.length) html+=`<div class="not-found">Not found in available public sources</div>`;
  html+=`</div></div>`;

  // Clients
  html+=`<div class="panel"><div class="panel-header">Select Clients</div><div class="panel-body">`;
  if(clients?.length){
    html+=`<div class="clients-grid">`;
    clients.forEach(c=>{
      html+=`<div class="client-card"><div class="client-icon">🏢</div><div class="client-name">${c.name}</div><div style="display:flex;flex-direction:column;align-items:center;gap:2px">${badge(c.confidence)}${srcLink(c.source)}</div></div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div class="not-found">Not found in available public sources</div>`;
  }
  html+=`</div></div>`;

  html+=`</div>`; // end grid-half

  // Sources
  if(sources?.length){
    html+=`<div class="sources-bar"><div class="sources-label">All sources consulted</div><div class="sources-list">`;
    sources.forEach(s=>{ html+=`<a class="source-tag" href="${s.url}" target="_blank">${s.title}</a>`; });
    html+=`</div></div>`;
  }

  r.innerHTML = html;
  r.style.display = 'block';
}

function goBack(){
  document.getElementById('result-view').style.display='none';
  document.getElementById('search-view').style.display='flex';
}
</script>
</body>
</html>
